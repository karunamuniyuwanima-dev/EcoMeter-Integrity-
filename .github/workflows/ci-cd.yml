name: EcoMeter CI/CD Pipeline

on:
  push:
    branches: [main, Backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. BACKEND — Install & Syntax Check ─────────────────────────────────────
  backend-ci:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm install

      - name: Check syntax (no errors)
        working-directory: Backend
        run: node --check server.js && echo "✅ server.js syntax OK"

  # ── 2. FRONTEND — Check all HTML pages exist ────────────────────────────────
  frontend-ci:
    name: Frontend CI (HTML check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify all 6 frontend pages exist
        run: |
          echo "Checking frontend pages..."
          for page in login.html index.html analytics.html alert_history.html reports.html settings.html; do
            if [ -f "Frontend/$page" ]; then
              echo "✅ FOUND: $page"
            else
              echo "❌ MISSING: $page" && exit 1
            fi
          done
          echo "✅ All frontend pages present"

  # ── 3. DEPLOY BACKEND — Trigger Render on push to main ──────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "🚀 Triggering Render deployment..."
            curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "✅ Render deploy triggered"
          else
            echo "⚠️  RENDER_DEPLOY_HOOK not set — skipping backend deploy"
          fi

  # ── 4. DEPLOY FRONTEND — Push to Netlify ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy Frontend to Netlify
        run: |
          if [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "🚀 Deploying frontend to Netlify..."
            netlify deploy --prod --dir=Frontend --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=${{ secrets.NETLIFY_SITE_ID }}
            echo "✅ Frontend deployed"
          else
            echo "⚠️  NETLIFY_AUTH_TOKEN not set — skipping frontend deploy"
          fi
